<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЛР2 - Калькулятор</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator" id="calculator">
    <div id="result" class="result">0</div>
    <div id="memory" class="memory">M: 0</div>

    <div class="row">
      <button class="my-btn secondary" id="btn_op_clear">C</button>
      <button class="my-btn secondary" id="btn_op_backspace">⌫</button>
      <button class="my-btn secondary" id="btn_op_sign">+/-</button>
      <button class="my-btn secondary" id="btn_op_percent">%</button>
      <button class="my-btn secondary" id="btn_op_div">/</button>
    </div>

    <div class="row">
      <button class="my-btn secondary" id="btn_op_sqrt">√</button>
      <button class="my-btn secondary" id="btn_op_square">x²</button>
      <button class="my-btn secondary" id="btn_op_cube">x³</button>
      <button class="my-btn secondary" id="btn_op_factorial">x!</button>
      <button class="my-btn primary" id="btn_op_mult">x</button>
    </div>

    <div class="row">
      <button class="my-btn" id="btn_digit_7">7</button>
      <button class="my-btn" id="btn_digit_8">8</button>
      <button class="my-btn" id="btn_digit_9">9</button>
      <button class="my-btn small" id="btn_digit_000">000</button>
      <button class="my-btn primary" id="btn_op_minus">-</button>
    </div>

    <div class="row">
      <button class="my-btn" id="btn_digit_4">4</button>
      <button class="my-btn" id="btn_digit_5">5</button>
      <button class="my-btn" id="btn_digit_6">6</button>
      <button class="my-btn secondary small" id="btn_op_mem_plus">M+</button>
      <button class="my-btn primary" id="btn_op_plus">+</button>
    </div>

    <div class="row">
      <button class="my-btn" id="btn_digit_1">1</button>
      <button class="my-btn" id="btn_digit_2">2</button>
      <button class="my-btn" id="btn_digit_3">3</button>
      <button class="my-btn secondary small" id="btn_op_mem_minus">M-</button>
      <button class="my-btn primary" id="btn_op_equal">=</button>
    </div>

    <div class="row">
      <button class="my-btn" id="btn_digit_0">0</button>
      <button class="my-btn" id="btn_digit_dot">.</button>
      <button class="my-btn secondary small" id="btn_ui_bg">BG</button>
      <button class="my-btn secondary small" id="btn_ui_text">TXT</button>
      <button class="my-btn secondary" id="btn_ui_reset">R</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
